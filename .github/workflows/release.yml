name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is a commit count, so the whole history has to be here

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release assets
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="v$(git rev-list --count HEAD)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X dboss/internal/version.Version=$version" -o "dist/dboss_${os}_${arch}" ./cmd/dboss
          done
          (cd dist && sha256sum dboss_* > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
