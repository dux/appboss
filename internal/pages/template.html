<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" type="image/svg+xml" href="{{dboss_logo}}">
<style>
:root {
  color-scheme: light dark;
  --bg: #f1f5f9;
  --card: #ffffff;
  --border: rgb(4 32 69 / 14%);
  --text: #182433;
  --muted: #667382;
  --primary: #0054a6;
  --primary-hover: #004a92;
  --shadow: 0 8px 24px rgb(4 32 69 / 10%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151f2c;
    --card: #1b2736;
    --border: rgb(255 255 255 / 10%);
    --text: #e6ebf1;
    --muted: #9aa7b6;
    --primary: #4a90d9;
    --primary-hover: #5e9fe2;
    --shadow: 0 8px 24px rgb(0 0 0 / 30%);
  }
}
* { box-sizing: border-box; }
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  min-height: 100vh;
  margin: 0;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main {
  width: 100%;
  max-width: 440px;
  padding: 36px 32px 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  box-shadow: var(--shadow);
  text-align: center;
}
.logo { display: block; width: 44px; height: 44px; margin: 0 auto 20px; }
h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
p { margin: 0; color: var(--muted); }
.action { margin-top: 24px; }
.action:empty { display: none; }
.action form { margin: 0; }
.action button,
.action a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 18px;
  border: 1px solid var(--primary);
  border-radius: 4px;
  background: var(--primary);
  color: #fff;
  font: inherit;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
}
.action button:hover,
.action a:hover { border-color: var(--primary-hover); background: var(--primary-hover); }
footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="{{dboss_logo}}" alt="">
  <h1>{{title}}</h1>
  <p>{{message}}</p>
  <div class="action">{{action}}</div>
</main>
<footer>{{status}} &middot; served by dboss</footer>
</body>
</html>
