# app-boss configuration reference
#
# One file name, two roles:
#   1. <host>/appboss.yaml            host config with `apps` (this document, part 1)
#   2. <app>/appboss.yaml             app config with `procfile` (part 2)
#   3. state files under state_dir  written by boss, never hand-edited (part 3)
#
# A file that has `procfile` is an app; a file that has `apps` is a host. Never both.
# An app file may also carry host keys so `appboss start` inside the app folder runs it
# standalone (single mode); the same file under a host must not, or the app is invalid.
# Whenever a folder is resolved to its config, appboss.local.yaml is used when it exists,
# appboss.yaml otherwise. The local file is server-only and gitignored.
#
# Rules that apply everywhere:
#   - Durations are Go duration strings: 30s, 20m, 6h, 72h. No days suffix; use 72h.
#   - Sizes are 10m, 512k, 1g (lowercase, powers of 1024).
#   - Every key shown has the default value shown. Omit a key to get the default.
#   - Every key that takes a list also accepts a single value: `hosts: myapp.com` is
#     `hosts: [myapp.com]`.
#   - Unknown keys are an error at load time, not a warning. Typos must not pass silently.
#   - Per-app values in an app's appboss.yaml override global defaults.* one key at a time.
#     Process keys can be overridden once more under processes.<name>; web keys cannot.
#   - App-level changes (defaults.* and app files) apply on rescan without a restart. Changing
#     apps, state_dir, log_dir, socket, proxy, management, ports or daemon needs a restart;
#     rescan and the console report which keys are waiting.
#   - $NAME in a value is replaced with that variable from the appboss process environment.
#     Only all-uppercase names are expanded; an unset name is left as written.
#     procfile commands and cron commands are never expanded; they are runtime shell lines.
#
# Load order at `appboss start`:
#   root appboss.yaml -> validate -> walk the apps directory (or use the root file itself in
#   single mode) -> per app: appboss.local.yaml or appboss.yaml, .env, .env.local
#   -> validate each app (an invalid app is reported and skipped, it does not stop the session)
#   -> terminate listeners in ports.range -> assign one fixed port per (app, proctype)
#   -> start apps that were running before and have autostart: true -> listen.

# =============================================================================
# PART 1: <host>/appboss.yaml
# =============================================================================
---
# --- Paths -------------------------------------------------------------------

# Directory whose entries are the apps. Relative paths resolve from the directory containing
# this file. Each entry is a symlink to an app folder or a plain subfolder; the entry name is
# the app name and dot entries are skipped. The entry path (not the symlink target) is the
# process working directory. Entries are walked in name order.
apps: ./apps

# Session-owned runtime state. Contains process state and the console signing key.
# Must be writable by the service user. Created on first run.
state_dir: ./.appboss/state

# Process logs and request logs. Contains <app>/<proctype>.log and <app>/requests.sqlite.
log_dir: ./.appboss/log

# Unix socket for the control API. The CLI talks here. In production set it to
# /run/appboss/appboss.sock: that is where `appboss restart` run inside an app folder looks when
# the folder's own socket does not exist, and the generated unit creates /run/appboss.
socket: ./.appboss/appboss.sock

# --- Proxy -------------------------------------------------------------------

proxy:
  # The public listener, one address or a list; every address gets its own listener
  # with the same routing. appboss owns port 80 and routes every request to an app;
  # Cloudflare proxies straight to it. The systemd unit grants CAP_NET_BIND_SERVICE,
  # so no root is needed. For a hand-run session on Linux use a high port such as
  # 127.0.0.1:8080. The management console is served on the same listener,
  # selected by management.host.
  # Set to "" to disable the proxy entirely (supervisor-only mode).
  listen: ":80"

  # Optional. When set, connections from any other source address get 403.
  # Use the Cloudflare ranges (https://www.cloudflare.com/ips/) so the origin IP
  # cannot be used to bypass Cloudflare or spoof CF-Connecting-IP. Empty means
  # accept from anywhere.
  trusted_cidrs:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32

  # Header that carries the real client IP, checked in order. First non-empty wins.
  # Falls back to the TCP remote address.
  client_ip_headers: [CF-Connecting-IP, X-Forwarded-For]

  # Response served when a request matches an app that is not running.
  wake:
    # Seconds sent in Retry-After and in the meta refresh of the starting page.
    retry_after: 5
    # Files served for the three non-forwarding cases. Relative paths resolve
    # against the boss binary's web/ directory; absolute paths are used as is.
    starting_page: web/starting.html   # app stopped or starting, GET + Accept: text/html
    crashed_page:  web/crashed.html    # app crashed (max_restarts hit), GET + Accept: text/html
    unknown_page:  web/404.html        # host matches no app

  # Upstream connection tuning. Rarely needs changing.
  upstream:
    dial_timeout: 2s          # connect to app port
    response_header_timeout: 60s   # app must start responding within this
    idle_conn_timeout: 90s
    max_idle_conns_per_app: 32
    # Streaming and websockets are always passed through; no toggle.

# --- Management console ------------------------------------------------------

# Omit this block to disable the management console.
# It is served by proxy.listen; only requests for this exact hostname reach it,
# so authentication never touches application traffic. It also listens on
# 127.0.0.1:<first port of ports.range>, still requiring this hostname in Host.
management:
  # Hostname accepted by the console and registered with AuthCog; one name or a list.
  # Point each at the box in Cloudflare like any app hostname.
  host: boss.example.com
  # Optional. The address operators open, printed on start next to the always-available
  # http://127.0.0.1:<first port> link. Its host must be one of the hosts above.
  url: https://boss.example.com
  auth:
    # AuthCog realm used for login and the server-side callback exchange.
    realm: auth.authcog.com
    # Only these authenticated email addresses may open the console.
    admin_emails:
      - admin@example.com
    # Signed console session lifetime.
    session_ttl: 24h

  # Health and metrics, served on the management host next to the console.
  metrics:
    # /healthz answers 200 while the daemon is up; /readyz answers 200 only when every
    # autostart app is running; /metrics is Prometheus text. Set false to disable all three.
    enabled: true
    # When set, /metrics requires "Authorization: Bearer <token>". Keep it out of the
    # committed file with $METRICS_TOKEN when the console host is public. /healthz and
    # /readyz need no token so an uptime checker can reach them.
    token: ""

# --- Ports -------------------------------------------------------------------

ports:
  # Inclusive range boss hands out. This range belongs exclusively to boss:
  # daemon startup and `appboss kill` terminate every listener in it before apps
  # start, and every spawn kills whatever still holds its port. This requires
  # `lsof`. The first port belongs to the management console, reserved whether
  # or not the console is enabled. After it one fixed port is assigned per
  # (app, proctype) at daemon start, in apps order, and never changes while
  # the daemon runs. The range must not overlap an HTTP listener.
  range: [3100, 3990]

# --- Per-app defaults --------------------------------------------------------
# Every key here can be overridden per app in the app's appboss.yaml with the same name.

defaults:
  # Stop the whole app after this long without a proxied HTTP request.
  # 0 means never. Websocket connections count as activity while open.
  idle_stop: 6h

  # Readiness check after spawn, flips starting -> running.
  #   tcp          connect to PORT succeeds
  #   http:<path>  GET http://127.0.0.1:PORT<path> returns 2xx
  health: tcp
  # Poll interval of the readiness and liveness checks, and give-up time for readiness.
  # On readiness give-up the process is killed and counts as one failed restart.
  health_interval: 500ms
  health_timeout: 60s
  # After the web process is ready it keeps being polled at health_interval. This many
  # consecutive failures restart it (kill, then the restart policy, backoff and max_restarts
  # apply); one success resets the count. 0 disables the ongoing check, so only readiness runs.
  # Applies to web_process only; workers are covered by their exit and restart policy.
  unhealthy_threshold: 3

  # Graceful stop: SIGTERM to the process group, wait, then SIGKILL.
  stop_timeout: 20s
  stop_signal: TERM         # TERM | INT | QUIT | USR1 | USR2

  # Restart policy when a process exits on its own (not via appboss stop).
  #   on-failure   restart only when exit code != 0 or killed by signal
  #   always       restart on any exit
  #   never        leave it stopped, mark app crashed if it was the web process
  restart: on-failure
  # Consecutive failures before the app is marked crashed and left alone.
  # A process that stays up longer than restart_reset resets the counter.
  max_restarts: 5
  restart_reset: 60s
  # Backoff between restarts: first delay, multiplier, cap.
  restart_backoff: [1s, 2.0, 60s]

  # Process log files (stdout+stderr of each proctype).
  log_max_size: 10m         # rotate when the file exceeds this
  log_keep: 5               # rotated files kept per proctype; 0 truncates the file in place
  log_tail_lines: 500       # lines kept in memory for `appboss logs` without -f

  # Log store (SQLite written by the proxy and the ingestion module).
  # Every app database holds the REQUEST rows from the proxy and the STDOUT rows from the
  # process log segments; appboss also tails every *.log file under the app's ./log directory.
  # Requests and app log files are pruned after log_retention, process stdout after
  # stdout_retention. 0 disables the matching channels for the app.
  log_retention: 336h       # 14 days for request rows and app log files
  stdout_retention: 3h      # process stdout and the appboss daemon log
  log_flush: 1s             # batch insert interval

  # Run procfile commands through `sh -c` instead of exec'ing the first word.
  # Needed for lines with &&, pipes, or $VAR. Off by default so signals reach
  # the real process, not a shell. Command strings are never env-expanded, so
  # $VAR here reaches the shell at run time.
  shell: false

  # Extra environment injected into every process of every app, lowest priority
  # (app .env files and boss-injected PORT/APP_NAME/PROC_TYPE win).
  env: {}
  #   RAILS_ENV: production

  # Resource backend. auto picks cgroup on Linux when the cgroup v2 hierarchy under
  # /sys/fs/cgroup/boss is writable, otherwise procgroup; force one with cgroup | procgroup.
  # The cgroup backend gives every (app, process) its own cgroup and applies the limits below.
  resources: auto
  # Limits, only enforced by the cgroup backend. A host that falls back to procgroup logs a
  # warning and ignores them.
  memory_max: 0             # 0 = unlimited. e.g. 512m
  cpu_max: 0                # 0 = unlimited. percent of one core, e.g. 150

  # --- Web keys: what nginx or Caddy did in front of the app. App-level only. -------------
  # Cloudflare owns TLS, compression, caching, WAF and rate limiting, so those are not here.
  # Order per request: canonical redirect -> allow_ips -> basic_auth -> maintenance -> static
  # -> max_body/body buffer -> wake or forward -> headers.

  # Directory served straight from disk for GET and HEAD, relative to the app folder.
  # A missing directory disables static serving for that app, so "./public" is safe globally.
  # Regular files only; directories and missing files fall through to the app. No index lookup.
  # Served with Last-Modified, If-Modified-Since and range support, without waking the app.
  static: ""
  # Public status path on the app's own hosts, so a Cloudflare health check or uptime monitor
  # can probe the app domain. GET/HEAD answer 200 {"app","state"} while the app runs and is not
  # draining, 503 otherwise. It runs before basic auth and never wakes the app. Empty disables it.
  health_endpoint: /.well-known/appboss/health
  # Path prefixes under static that get "public, max-age=31536000, immutable".
  # Everything else under static gets "public, max-age=3600".
  static_immutable: [/assets/]

  # Request body limit. 0 = none. The body is read in full before the app is contacted
  # (in memory up to 1m, larger bodies spill to a temp file) so the app never sees a
  # partial upload. A declared or chunked body over the limit answers 413 without forwarding.
  max_body: 0

  # HTTP basic auth: user -> bcrypt hash, generated with `appboss password`. Empty = open.
  # Set globally on a staging box to protect every app with one line. Applies to static files too.
  basic_auth: {}
  #   alice: "$2a$10$..."

  # CIDRs allowed to reach the app; empty = everyone. The client IP comes from
  # proxy.client_ip_headers (CF-Connecting-IP), not the Cloudflare edge address.
  allow_ips: []
  #   - 10.0.0.0/8

  # Response headers added to every app and static response. An empty value removes the
  # header, which is how an app drops X-Powered-By. Redirects, auth challenges and error
  # pages are not touched.
  headers: {}
  #   X-Frame-Options: DENY
  #   X-Powered-By: ""

  # File served while the app is in maintenance mode (`appboss maintenance <app> on`), relative
  # to the app folder. Default: <static>/503.html when it exists, then the built-in page.
  # HTML GETs get the page with 503 and Retry-After: 30; everything else an empty 503.
  maintenance_page: ""

# --- Daemon ------------------------------------------------------------------

daemon:
  # How often the idle-stop ticker runs.
  idle_tick: 1m
  # On daemon start, restart apps that running.json says were running before
  # and have autostart: true. Without a running.json yet (first start) every
  # discovered app with autostart: true is started.
  resume_running: true
  # Daily prune of logs and request rows older than log_retention, at this local time.
  prune_at: "04:10"
  # Daily SQLite VACUUM of every app database and the host database, at this local time.
  # Reclaims the space the prune freed. Set to "" to disable; run it off peak if the box
  # is busy, since VACUUM rewrites each database.
  vacuum_at: "04:30"
  # appboss's own log always goes to stderr: the terminal in the foreground, journald under systemd.
  log_level: info           # debug | info | warn | error
  # How often each running process's log segment is sealed and ingested into the per-app
  # log store. A sealed segment stays on disk until its rows are committed.
  log_ingest_interval: 5s
  # How long operator actions in the audit table are kept. 0 keeps them forever. The daily
  # prune drops older rows.
  audit_retention: 8760h

# --- Notifications -----------------------------------------------------------
# Post runtime events to one operator webhook. Best-effort: a slow endpoint never blocks the
# supervisor, and repeated events for the same app are debounced by min_interval.

notify:
  # Webhook address. Empty disables all notifications. Use $ALERT_WEBHOOK_URL to keep the
  # secret out of the committed file.
  url: ""
  # Payload shape:
  #   generic   the event as JSON: {"event","app","error","time"}
  #   slack     {"text": "..."} for a Slack incoming webhook
  #   discord   {"content": "..."} for a Discord webhook
  #   ntfy      {"title","message","tags"} for an ntfy topic
  format: generic
  # Events to post:
  #   crash           an app entered the crashed state
  #   restart-loop    a process failed and restarted again (second failure and later)
  #   health-timeout  the readiness check gave up, or the web process failed its liveness checks
  #   wake-failed     a request tried to start a stopped app and the start failed
  #   hook-failed     a deploy hook exited non-zero
  #   deploy          a deploy hook with restart: true succeeded and the app rolled
  #   config-changed  a config write needs a restart (host keys changed on disk)
  #   backup-failed   a PostgreSQL backup dump or upload failed
  events: [crash, restart-loop, health-timeout, wake-failed, hook-failed, deploy, config-changed, backup-failed]
  # Quiet period per app and event. 0 posts every event.
  min_interval: 5m
  # Extra headers sent with every request.
  headers: {}
  #   Authorization: "Bearer $TOKEN"

# --- PostgreSQL --------------------------------------------------------------
# Optional. When a server is reachable the management console gains a PostgreSQL tab with server
# facts, database sizes, activity and the backup history. With backup.databases empty nothing is
# scheduled, so the block is read-only until you select databases (the console writes the
# selection to appboss.local.yaml). This feature needs pg_dump, pg_dumpall and pg_restore on the
# service user's PATH.

postgres:
  # false hides the tab and stops all inspection and backups.
  enabled: true
  # libpq connection string or URL. Keep a password out of the committed file with $DATABASE_URL.
  # Empty means: try /var/run/postgresql, then 127.0.0.1:5432, with the PG* environment merged in.
  dsn: ""
  backup:
    # Local directory that receives dumps, one subfolder per database. Empty disables local
    # copies, so a database with s3: false and no dir has nowhere to go and is rejected.
    dir: ./.appboss/pg-backups
    # Default destination for every selected database. A database can override it per entry.
    s3: true
    # Interval between scheduled backups, a Go duration. 0 makes backups manual only.
    every: 6h
    # Kill a dump that is still running after this long. 0 means no limit.
    timeout: 1h
    # Also dump roles and tablespaces with pg_dumpall --globals-only, as one _globals entry.
    globals: true
    # Grandfather-father-son retention. Each bucket keeps the newest N dumps for its period
    # (hour, day, ISO week, month) and the rest are removed from disk and S3. 0 disables a bucket.
    keep:
      hourly: 24
      daily: 7
      weekly: 8
      monthly: 6
    # Databases to back up. A key being present selects the database; the value overrides the
    # destinations above. {} selects it for both local and s3.
    databases: {}
    #   myapp_production: {}            # local + s3
    #   reports: {local: false}         # s3 only
    #   legacy: {s3: false}             # local only

# --- Object storage ----------------------------------------------------------
# Optional S3-compatible storage for off-host backup copies. Cloudflare R2, AWS S3 and MinIO all
# work. Empty endpoint or bucket disables it. Keep the keys out of the committed file with $VARS.

s3:
  # Full endpoint URL. Empty disables object storage.
  endpoint: ""
  #   https://<account>.r2.cloudflarestorage.com
  # Bucket region. auto is the R2 default.
  region: auto
  # Bucket that receives the objects. Empty disables object storage.
  bucket: ""
  #   appboss-backups
  # Key prefix prepended to every object (a trailing / is added).
  prefix: ""
  #   pg/
  access_key: $S3_ACCESS_KEY
  secret_key: $S3_SECRET_KEY
  # Path-style addressing. Required by MinIO and some other S3 servers.
  path_style: false
  # Server-side encryption algorithm for uploads, e.g. AES256. Empty uses the bucket default.
  sse: ""

# =============================================================================
# PART 2: <app>/appboss.yaml   (required, per app)
# =============================================================================
---
# Only keys listed here are allowed under a host. Anything under defaults.* in the host config
# can be repeated here with the same name to override it for this app. When this file is the
# one `appboss start` runs directly (single mode), part 1 keys are allowed as well.

# Required process map. Keys are process names and values are commands.
# Names must match [a-z][a-z0-9_-]* and commands must not be empty.
# Command strings are not env-expanded; $VAR is passed to the shell at run time.
procfile:
  web: bundle exec puma -C config/puma.rb
  worker: bundle exec lux jobs:work
  cron: bundle exec lux jobs:cron

# Hostnames the proxy routes to this app's `web` process. Required for any app
# that should receive HTTP. An app without hosts is background-only.
# Exact match on the Host header, case-insensitive, port stripped.
# A leading "*." matches subdomains only; a leading "." matches the bare domain and every
# subdomain, so ".myapp.com" means "myapp.com" and "*.myapp.com". Longest match wins.
hosts:
  - ".myapp.com"

# Which proctype receives proxied traffic. Only one. Default: web.
web_process: web

# Start policy. true starts the app with the host and brings it back on resume. false leaves
# it stopped until `appboss run`, the console, or any proxied request starts it; a host restart
# does not bring it back. button is like false, but a request answers a page with a start button
# and only its POST starts the app, so a crawler or favicon GET never does.
autostart: true

# Optional. Must be one of hosts. Requests for any other host of this app answer 301 to
# <scheme>://<canonical_host><path?query>; the scheme follows X-Forwarded-Proto, default https.
# Runs before auth and static files, so www never serves content.
canonical_host: myapp.com

# Per-app overrides of defaults.* (all optional, same semantics as above).
idle_stop: 0                # this app never sleeps
health: http:/up
health_timeout: 90s
stop_timeout: 30s
stop_signal: TERM
restart: on-failure
max_restarts: 5
shell: false
log_retention: 168h
stdout_retention: 3h
memory_max: 512m
cpu_max: 0
env:
  MALLOC_ARENA_MAX: "2"
static: ./public
static_immutable: [/assets/, /packs/]
max_body: 50m
headers:
  X-Powered-By: ""

# Ports are NOT configurable per app. boss allocates one per (app, proctype)
# from ports.range and injects it as PORT into that process's environment,
# always, for every procfile entry. There is no pin, no override, no opt-out.
# An app that ignores PORT and binds its own port will not be reachable
# through the proxy. Read the allocation with `appboss ports`.

# Per-proctype overrides. Process keys only (health, stop, restart, logs, shell, env,
# resources); a web key here is an error. Useful for a worker that needs a longer
# stop_timeout than the web process.
processes:
  worker:
    stop_timeout: 120s
    restart: always

# Scheduled one-shot commands, run by the daemon and independent of the app's run state:
# a stopped or idle app still fires its jobs. Each job runs in the app folder with the app
# environment (APP_NAME, PROC_TYPE, APPBOSS_SOCKET; no PORT), logs to its own channel and does
# not count as activity for idle_stop. There is no catch-up: after a daemon restart the next
# run is computed forward from that moment.
cron:
  # Job name, unique in the app; matches [a-z][a-z0-9_-]*.
  cleanup:
    # Either "every <n><s|m|h|d>" or a 5-field cron expression (min hour day month weekday).
    # Cron fields accept *, */n, a-b, a-b/n, a,b,c and JAN..DEC / SUN..SAT; 0 and 7 are Sunday.
    schedule: every 6h
    # Command run once per fire. Split on whitespace and exec'd directly unless shell: true.
    command: bundle exec rake cleanup
    # Kill a run that is still going after this long. 0 = no limit.
    timeout: 30m
    # false (the default) skips a scheduled run while the previous one is still going.
    overlap: false
    # true keeps the job configured but never scheduled.
    disabled: false
  report:
    schedule: "0 7 * * 1-5"
    command: bundle exec rake report:daily

# Deploy hooks: named one-shot commands a signed HTTP POST can trigger, independent of the app's
# run state. The ping URL is <management.url>/hooks/<app>/<hook>. Auth is a token: either
# ?token=<secret> in the URL, Authorization: Bearer <secret>, X-Gitlab-Token: <secret>, or a
# GitHub X-Hub-Signature-256 HMAC over the raw body. With no secret here, appboss generates a
# 64-character secret under state_dir on first use; `appboss hooks` prints the full URL.
hooks:
  # Hook name, unique in the app; matches [a-z][a-z0-9_-]*.
  deploy:
    # Command run once per trigger in the app folder with the app environment (no PORT).
    command: ./deploy.sh
    # Kill a run still going after this long. 0 = no limit.
    timeout: 10m
    # true restarts the app (or starts it) when the command exits 0.
    restart: true
    # false (the default) skips a ping while the previous run is still going.
    overlap: false
    # true keeps the hook configured but its endpoint answers 404.
    disabled: false
    # Token the caller must present. Keep it out of the committed file: use $DEPLOY_SECRET or
    # leave it empty and let appboss generate one under state_dir (rotate it with
    # `appboss hooks rotate`). A secret set here wins over the generated one.
    secret: $DEPLOY_SECRET

# Realtime channels (pub/sub). When path is set, boss serves a small hub on this app's own
# hosts. It is independent of the app process: a subscriber can connect while the app is
# stopped, and realtime traffic never wakes it.
#
#   Subscribe   GET <path>/<channel>            Upgrade: websocket  -> WebSocket
#                                               Accept: text/event-stream -> SSE
#   Publish     POST <path>/<channel>           Authorization: Bearer <secret>
#                                               body {"event": "...", "data": ...}
#   Client lib  GET <path>/client.js
#   Self-test   GET <path>/_test                only when test: true
#
# Messages are fanned out to every subscriber of the same app and channel. The last `replay`
# are replayed to a subscriber that joins late. A slow client is dropped, never blocking the
# publisher. Channels are one path segment; `client.js`, `_test` and `_selftest` are reserved.
# `appboss pubsub help` prints the same guide with copy-paste examples.
pubsub:
  # URL prefix on the app's hosts. Empty disables the whole feature. Must start with /.
  path: ""
  #   /socketio
  # Bearer token a publisher presents. Empty generates a 64-character secret per app under
  # state_dir on first use; `appboss pubsub` prints it and `appboss pubsub rotate` replaces it.
  # A secret set here wins and cannot be rotated from the console.
  secret: ""
  #   $PUBSUB_SECRET
  # Messages kept per channel and replayed to a late subscriber, oldest first.
  replay: 10
  # Subscriber limit per app across all channels. 0 means unlimited. Further connects get 503.
  max_clients: 500
  # Largest accepted publish body. 0 means unlimited.
  max_message_size: 64k
  # When true, a subscribed WebSocket client may publish to its own channel by sending the
  # same {"event","data"} envelope. SSE is one-way, so client events are WebSocket only.
  client_events: true
  # Serve the interactive self-test page at <path>/_test. It opens a WebSocket and an SSE
  # connection and reports PASS/FAIL, so a browser can confirm the hub end to end.
  test: false

# Procfile behavior:
#   - Each command is split on whitespace and exec'd directly unless shell: true.
#   - Each entry becomes unit boss-<app>-<name> and gets its own PORT.
#   - PORT is always injected by boss for every line, including workers and
#     cron-style processes that never listen. Not configurable. A PORT set in
#     .env or .env.local is overwritten and a warning is logged.
#   - Env available to every command, in priority order (highest first):
#       PORT, APP_NAME, PROC_TYPE, APPBOSS_SOCKET    injected by boss, always win
#       .env.local                                server-only overrides
#       .env                                      committed defaults
#       defaults.env / appboss.yaml env             boss config
#       mise env (PATH and tool vars)             when mise.toml exists
#       daemon's own environment                  minimal: HOME, LANG, TZ
#
# --- .env / .env.local format ------------------------------------------------
#
#   KEY=value              no quotes needed
#   KEY="quoted value"     double quotes allow \n and \" escapes
#   KEY='single'           literal
#   # comment
#   export KEY=value       "export " prefix is tolerated and stripped
#   - No variable interpolation. ${OTHER} stays literal.
#   - .env.local should be mode 0600 and is never rsynced by lux-deploy.

# =============================================================================
# PART 3: state files under state_dir (written by boss, read-only for humans)
# =============================================================================
---
# state_dir/running.json
# Apps the daemon intends to be running. Updated on every start/stop.
# Used by daemon.resume_running after a daemon restart or reboot.
running.json:
  - myapp
  - myapp-staging

# state_dir/maintenance.json
# Apps currently in maintenance mode. Updated by `appboss maintenance`; survives a restart.
#
# state_dir/<app>/<proctype>.pid
# One line: the pid of the running child. Removed when the process exits.
#
# state_dir/last_activity.json
# Map of app -> RFC3339 timestamp of the last proxied request. Flushed every
# idle_tick so idle accounting survives a daemon restart.
#
# state_dir/management-auth.key
# Random 32-byte key used to sign management console sessions.
# Created with mode 0600 when the console first starts.

# =============================================================================
# CLI lookup rules
# =============================================================================
#
#   Config, every command:   -c path, then $APPBOSS_CONFIG, then ./appboss.local.yaml or ./appboss.yaml.
#   Socket, remote commands: --socket, then $APPBOSS_SOCKET, then the socket of the config found
#                            above if that file exists on disk, then /run/appboss/appboss.sock.
#   App, remote commands:    the argument, or inside an app folder that folder's app.
#
#   appboss start [-c path]                      foreground host session
#   appboss systemd [-c path] [--user u] [--bin p] [--install]
#   appboss kill [-c path]                       stop every app and clear ports.range
#   appboss maintenance [app] on|off             answer with the maintenance page, app keeps running
#   appboss password                             print a bcrypt hash for basic_auth
#   APPBOSS_SOCKET is injected into app processes, so a process can always find its host.
#
# `appboss config` validates the host file and prints it as written, comments included.
# `appboss config <app>` does the same for that app's file.
# `appboss config -d` / `--defaults` prints the resolved config with every default filled in.
# `appboss config --reference` prints this document.
# Errors name the file, line and key: an unknown key suggests the closest valid one.
# `appboss check` validates the config and every app without starting anything.
#
# The management console edits these same files: the host file and, per app, the file appboss
# reads for that folder (appboss.local.yaml when it exists). "Create server override" copies
# appboss.yaml to appboss.local.yaml so edits made on the box survive the next deploy.
