# dboss configuration reference
#
# One file name, two roles:
#   1. <host>/dboss.yaml            host config with `apps` (this document, part 1)
#   2. <app>/dboss.yaml             app config with `procfile` (part 2)
#   3. state files under dir/state  written by dboss, never hand-edited (part 3)
#
# A file that has `procfile` is an app; any other file is a host, with `apps` defaulting to
# ./apps. Never both. With no config file at all, `dboss start` runs the default host.
# An app file may also carry host keys so `dboss start` inside the app folder runs it
# standalone (single mode); the same file under a host must not, or the app is invalid.
# Whenever a folder is resolved to its config, dboss.local.yaml is used when it exists,
# dboss.yaml otherwise. The local file is server-only and gitignored. A folder with neither is
# searched in its config/ subfolder (config/dboss.yaml); relative paths still resolve against
# the folder itself, and config files in both places are an error.
#
#
# Rules that apply everywhere:
#   - Durations are Go duration strings (30s, 20m, 6h, 72h) or a day count (7d); false means 0.
#   - Sizes are 10m, 512k, 1g (lowercase, powers of 1024).
#   - Every key shown has the default value shown. Omit a key to get the default.
#   - Every key that takes a list also accepts a single value, so `allow_ips: 10.0.0.0/8` is
#     short for `allow_ips: [10.0.0.0/8]`.
#   - Unknown keys are an error at load time, not a warning. Typos must not pass silently, and a
#     key dboss dropped names its replacement.
#   - Per-app values in an app's dboss.yaml override global defaults.* one key at a time.
#     Process keys can be overridden once more under processes.<name>; web keys cannot.
#   - App-level changes (defaults.*, pages, tokens and app files) apply on rescan without a
#     restart. Changing apps, dir, ports, log_level, audit_retention, maintenance_at,
#     authcog_realm, proxy, management or notify needs a restart; rescan and the console report
#     which keys are waiting.
#   - $NAME in a value is replaced with that variable from the dboss process environment.
#     Only all-uppercase names are expanded; an unset name is left as written.
#     procfile commands and cron commands are never expanded; they are runtime shell lines.
#   - Any key may be written twice, once with a _dev suffix: `listen: ":80"` next to
#     `listen_dev: ":3000"`. A dev session (one app run from its own folder, the file below
#     that has procfile) takes the _dev value; every other session drops it, so one committed
#     app file serves both. The value replaces the base key outright, so a block override names
#     the leaf key it changes rather than restating the block. The suffix works at every depth
#     and inside free-form maps, so procfile, env and headers entries take it too.
#     A dev session also gets the management console on a loopback port from ports, with no
#     management block and no sign-in; see that block for what it costs.
#
# Load order at `dboss start`:
#   root dboss.yaml -> validate -> walk the apps directory (or use the root file itself in
#   single mode) -> per app: dboss.local.yaml or dboss.yaml, .env, .env.local
#   -> validate each app (an invalid app is reported and skipped, it does not stop the session)
#   -> terminate listeners in ports -> assign one fixed port per (app, proctype)
#   -> start apps that were running before and have autostart: true -> listen.

# =============================================================================
# PART 1: <host>/dboss.yaml
# =============================================================================
---
# --- Host --------------------------------------------------------------------

# Directory whose entries are the apps. Defaults to ./apps, so a host file needs no apps key.
# Relative paths resolve from the directory containing this file. Each entry is a symlink to
# an app folder or a plain subfolder; the entry name is the app name and dot entries are
# skipped. The entry path (not the symlink target) is the process working directory. Entries
# are walked in name order.
apps: ./apps

# Everything dboss writes, created on first run and writable by the service user:
#   state/       process state, the console signing key, config history, ACME certificates
#   log/         process logs and the per-app log store (<app>/dboss.sqlite)
#   dboss.sock   the control socket the CLI talks to. `dboss restart` inside an app folder
#                finds it through the config there, else at /run/dboss/dboss.sock.
dir: ./.dboss

# Inclusive port range dboss owns and hands out. Daemon startup and `dboss kill` terminate every
# listener in it before apps start, and every spawn kills whatever still holds its port; this
# requires `lsof`. The first port belongs to the management console, reserved whether or not the
# console is enabled. After it one fixed port is assigned per (app, proctype) at daemon start, in
# apps order, and never changes while the daemon runs. The range must not overlap an HTTP listener.
# A dev session (dboss start in an app folder) shares the range with the dev sessions of other
# folders instead: it claims the next free ports for its console, processes, proxy and HTTPS from
# a per-user registry, gets the same ones back on its next start while they are free, and only
# clears what an earlier run of its own folder left behind; `dboss kill` there clears only its
# own ports.
ports: [3100, 3990]

# dboss's own log level. The log always goes to stderr: the terminal in the foreground, journald
# under systemd.
log_level: info           # debug | info | warn | error

# How long operator actions in the audit table are kept. 0 keeps them forever.
audit_retention: 8760h

# Daily housekeeping at this local time: logs and request rows older than their retention are
# pruned, then every app database and the host database is VACUUMed to reclaim the space. Run it
# off peak, since VACUUM rewrites each database.
maintenance_at: "04:10"

# Post disk-low once a filesystem holding the config, the apps or the runtime folder is fuller
# than this percent. Checked once a minute; 0 disables it. Applies on rescan.
disk_alert: 90

# AuthCog host the console and every app sign-in (auth, authcog) use.
authcog_realm: auth.authcog.com

# Host fallback for the pages dboss serves itself; see pages in part 2. The host folder also holds
# the two host-only pages, 404.html (no app owns the host) and login.html (the console without a
# session). Relative to this file.
pages: ./public/error_pages

# --- Tokens ------------------------------------------------------------------

tokens:
  # Outbound: the personal access token a `deploy: true` pull hook, a github_pr preview and
  # `dboss add` use for a private repository. The git process gets it through the environment only
  # (a credential helper dboss injects reads it), never argv and never the repo's config, and the
  # helper answers for https://github.com only, so a remote on another host never sees it. Empty
  # leaves the pull anonymous. Needs git 2.31+ for the env-injected helper.
  github: $GITHUB_TOKEN
  # Inbound: the token every caller presents to dboss. A hook ping carries it as ?token=, as
  # Authorization: Bearer, as X-Gitlab-Token, or signs the raw body with it as GitHub's
  # X-Hub-Signature-256 (paste it into the webhook's Secret field). /metrics takes it as a bearer
  # token. You choose it, e.g. `openssl rand -hex 32`. Unset refuses every hook and hides /metrics.
  dboss: $DBOSS_TOKEN

# --- Proxy -------------------------------------------------------------------

proxy:
  # The public listener, one address or a list; every address gets its own listener
  # with the same routing. dboss owns port 80 and routes every request to an app;
  # Cloudflare proxies straight to it. The systemd unit grants CAP_NET_BIND_SERVICE,
  # so no root is needed. For a hand-run session on Linux use a high port such as
  # 127.0.0.1:8080. The management console is served on the same listener,
  # selected by management.host.
  # Set to "" to disable the proxy entirely (supervisor-only mode).
  # A dev session ignores it: its proxy takes a free port from ports, or :80 with
  # `dboss start --https`.
  listen: ":80"

  # The box sits behind Cloudflare: only Cloudflare's published ranges
  # (https://www.cloudflare.com/ips/, built in) and loopback may connect, everyone else gets 403,
  # and the client address comes from CF-Connecting-IP. So the origin cannot be reached around
  # Cloudflare and the header cannot be spoofed. false (the default) uses the connection's own
  # address.
  cloudflare: false

  # Optional built-in TLS, for a box that is reached directly instead of through Cloudflare.
  # dboss terminates HTTPS itself and obtains certificates from Let's Encrypt on demand for the
  # hosts of the current apps and the console; nothing else may get a certificate, so a stranger
  # cannot exhaust the authority's rate limit. Certificates are cached under dir/state/acme and
  # renewed automatically, and plain http redirects to https. Leave listen empty to keep TLS at the
  # edge (Cloudflare).
  # A dev session (dboss start in an app folder) never uses ACME and ignores listen: only
  # `dboss start --https` serves HTTPS, on :443, with certificates from a local authority in the
  # user config directory, and plain http stays on at :80. `dboss trust` adds that root to the
  # system store.
  tls:
    # Address of the HTTPS listener. Empty disables built-in TLS.
    listen: ""              # e.g. ":443"
    # Contact address registered with the certificate authority. Optional but recommended.
    email: ""

  # How long an app may take to start responding. Streaming and websockets are always passed
  # through once the response has started.
  timeout: 60s

# --- Management console ------------------------------------------------------

# Omit this block to disable the management console.
# It is served by proxy.listen at https://<first host>; only requests for these hostnames reach
# it, so authentication never touches application traffic. It also listens on
# 127.0.0.1:<first port of ports>, which answers to those hostnames and to any loopback name.
# /healthz (200 while the daemon is up) and /readyz (200 when every autostart app runs) are
# always open; /metrics (Prometheus text) needs tokens.dboss as a bearer token.
#
# A dev session (one app run from its own folder, the file has procfile) always
# has a console on a loopback port from ports, with or without this block, and signs a
# request whose peer is 127.0.0.1 straight in, so admins is not required
# there. The check is the connecting address and never a forwarded-for header:
# do not put nginx, caddy or cloudflared in front of an app run this way, or
# every request through it looks local and the console is open to all of them.
# Sign-in goes to authcog_realm and lasts defaults.session_ttl.
management:
  # Hostname accepted by the console and registered with AuthCog; one name or a list.
  # Point each at the box in Cloudflare like any app hostname.
  host: dboss.example.com
  # Only these authenticated email addresses may open the console.
  admins:
    - admin@example.com

# --- Per-app defaults --------------------------------------------------------
# Every key here can be overridden per app in the app's dboss.yaml with the same name.

defaults:
  # Stop the whole app after this long without a proxied HTTP request; the next request
  # wakes it. 0 (the default) never stops it; set it for review or preview apps.
  # Websocket connections count as activity while open.
  idle_stop: 0

  # Readiness check after spawn, flips starting -> running.
  # The check itself is `health` on a web process in the procfile: a path such as /up that must
  # answer 2xx, or omitted for a plain TCP connect to PORT. Only web processes are checked. While
  # the process starts it is polled every 500ms, so a visitor who woke the app waits little.
  health_timeout: 60s

  # Once the process has answered once, the same check keeps running at this slower rate for
  # the rest of its life, so a healthy app is not asked every half second forever.
  # A hand-run session (stdout is a terminal) relaxes this to 5 minutes, because a developer
  # watching one app does not need it polled every ten seconds and every poll lands in their own
  # request log. Under systemd the configured value is used as written. A value above 5 minutes
  # is kept either way; dev only ever slows the check down.
  liveness_interval: 10s
  # This many consecutive liveness failures restart the process (kill, then the restart policy,
  # backoff and max_restarts apply); one success resets the count. 0 disables the ongoing check,
  # so only readiness runs and liveness_interval is never used.
  # Applies to web processes only; workers are covered by their exit and restart policy.
  unhealthy_threshold: 3

  # Graceful stop: SIGTERM to the process group, wait, then SIGKILL.
  stop_timeout: 20s
  stop_signal: TERM         # TERM | INT | QUIT | USR1 | USR2

  # Restart policy when a process exits on its own (not via dboss stop).
  #   on-failure   restart only when exit code != 0 or killed by signal
  #   always       restart on any exit
  #   never        leave it stopped, mark app crashed if it was a web process
  # Restarts back off from 1s, doubling up to 60s; a process that stays up for a minute resets
  # the count.
  restart: on-failure
  # Consecutive failures before the app is marked crashed and left alone.
  max_restarts: 5

  # Log store (SQLite written by the proxy and the ingestion module).
  # Every app database holds the REQUEST rows from the proxy and the STDOUT rows from the
  # process log segments; dboss also tails every *.log file under the app's ./log directory.
  # Requests and app log files are pruned after log_retention, process stdout after
  # stdout_retention. 0 disables the matching channels for the app. Process log files rotate at
  # 10m and keep 5 rotated files.
  log_retention: 336h       # 14 days for request rows and app log files
  stdout_retention: 3h      # process stdout and the dboss daemon log

  # Housekeeping of the app's own ./tmp directory. Once a day dboss deletes the files last
  # modified longer than tmp_clean ago, then the sub-directories that are left empty. The
  # tmp directory itself always stays, and an app without one is skipped. A file a long
  # running process wrote once and still uses (a pid file, a socket) ages like any other
  # file, so set tmp_clean to false when the app keeps something there for longer.
  tmp_clean: 7d             # false or 0 never touches ./tmp

  # Extra environment injected into every process of every app, lowest priority
  # (app .env files and dboss-injected PORT/APP_NAME/PROC_TYPE win).
  env: {}
  #   RAILS_ENV: production

  # Limits. On Linux with a writable cgroup v2 hierarchy under /sys/fs/cgroup/dboss every
  # (app, process) gets its own cgroup and these apply; elsewhere they are ignored with a warning.
  memory_max: 0             # 0 = unlimited. e.g. 512m
  cpu_max: 0                # 0 = unlimited. percent of one core, e.g. 150

  # --- Web keys: what nginx or Caddy did in front of the app. Shared by every web process. ----
  # Set here for every app, or at the top level of one app's file to override it there. The
  # per-process web keys (hosts, pubsub, health, canonical_host) live on the procfile entry.
  # Cloudflare owns TLS, compression, caching, WAF and rate limiting, so those are not here.
  # Order per request: canonical redirect -> allow_ips -> deny -> auth -> basic_auth -> maintenance
  # -> static -> max_body/body buffer -> wake or forward -> headers.

  # Directory served straight from disk for GET and HEAD on every web process, relative to the
  # app folder. true means ./public (the default), a path sets another directory, false disables
  # serving. A missing folder simply turns serving off. Regular files only, no index lookup, and
  # only the extensions in static_extensions; served with Last-Modified, If-Modified-Since and
  # range support, without waking the app.
  static: ./public
  # File extensions served from the app's static directory, lowercase and without the dot;
  # the match ignores case. Anything else under the directory (an .html page, a dotfile, a file
  # with no extension) is the app's to answer, even when the file exists. [] serves any regular file.
  static_extensions: [css, js, mjs, map, json, txt, xml, ico, png, jpg, jpeg, gif, svg, webp, avif, woff, woff2, ttf, otf, eot, mp4, webm, mp3, pdf, wasm, webmanifest]
  # Public status path on the app's own hosts, so a Cloudflare health check or uptime monitor
  # can probe the app domain. GET/HEAD answer 200 {"app","state"} while a visitor would be served:
  # the app runs, or it is stopped (idle_stop, dboss stop) and the next request wakes it. Draining,
  # maintenance, starting, crashed and a stopped `autostart: button` app answer 503.
  # It runs before basic auth and never wakes the app. Empty disables it. It lives under
  # /.well-known/ so it never shadows an app's own /up or /health route.
  health_endpoint: /.well-known/dboss/health
  # Path prefixes under the static directory that get "public, max-age=31536000, immutable".
  # Everything else under it gets "public, max-age=3600".
  static_immutable: [/assets/]

  # Request body limit. 0 = none. The body is read in full before the app is contacted
  # (in memory up to 1m, larger bodies spill to a temp file) so the app never sees a
  # partial upload. A declared or chunked body over the limit answers 413 without forwarding.
  max_body: 0

  # HTTP basic auth: user -> plain password or bcrypt hash (generated with `dboss password`).
  # A value bcrypt can parse is a hash, anything else is the password itself. Empty = open.
  # Set globally on a staging box to protect every app with one line. Applies to static files too.
  basic_auth: {}
  #   alice: "$2a$10$..."
  #   bob: secret

  # CIDRs allowed to reach the app; empty = everyone. Behind proxy.cloudflare the client address
  # is CF-Connecting-IP, not the Cloudflare edge address.
  allow_ips: []
  #   - 10.0.0.0/8

  # Path patterns answered with 403 before the app is contacted, matched against the path without
  # its query string and ignoring case. *.php refuses any path ending in .php, /admin/* refuses
  # /admin and everything under it, and a plain /path is exact. Empty refuses nothing.
  deny: []
  #   - "*.php"
  #   - /admin/*
  #   - /server-status

  # Response headers added to every app and static response. An empty value removes the
  # header, which is how an app drops X-Powered-By. Redirects, auth challenges and error
  # pages are not touched.
  headers: {}
  #   X-Frame-Options: DENY
  #   X-Powered-By: ""

  # How long a sign-in lasts: an app's auth gate and, set here, the management console.
  session_ttl: 24h

# --- Notifications -----------------------------------------------------------
# Post runtime events to one operator webhook. Best-effort: a slow endpoint never blocks the
# supervisor, and one event for one app is posted at most once every 5 minutes.

notify:
  # Webhook address. Empty disables all notifications. Use $ALERT_WEBHOOK_URL to keep the
  # secret out of the committed file. The payload follows the address:
  #   hooks.slack.com                 {"text": "..."} for a Slack incoming webhook
  #   discord.com/api/webhooks/...    {"content": "..."} for a Discord webhook
  #   ntfy.sh or an ntfy.* host       {"title","message","tags"} for an ntfy topic
  #   anything else                   the event as JSON: {"event","app","error","time"}
  url: ""
  # Events to post:
  #   crash           an app entered the crashed state
  #   restart-loop    a process failed and restarted again (second failure and later)
  #   health-timeout  the readiness check gave up, or a web process failed its liveness checks
  #   wake-failed     a request tried to start a stopped app and the start failed
  #   hook-failed     a deploy hook exited non-zero
  #   cron-failed     a cron job exited non-zero, timed out or could not start
  #   deploy          a deploy hook with restart: true succeeded and the app rolled
  #   config-changed  a config write needs a restart (host keys changed on disk)
  #   backup-failed   a PostgreSQL backup dump or upload failed
  #   error-rate      an app answered with too many 5xx in the last 5 minutes
  #   slow            an app's p95 latency crossed alerts.slow_p95
  #   oom             the kernel OOM killer stopped a process at its memory_max (cgroup backend)
  #   disk-low        a filesystem dboss writes to is fuller than disk_alert percent
  events: [crash, restart-loop, health-timeout, wake-failed, hook-failed, cron-failed, deploy, config-changed, backup-failed, error-rate, slow, oom, disk-low]
  # Extra headers sent with every request.
  headers: {}
  #   Authorization: "Bearer $TOKEN"

# --- PostgreSQL --------------------------------------------------------------
# Optional. When a server is reachable the management console gains a PostgreSQL tab with server
# facts, database sizes, activity and the backup history. With backups empty nothing is
# scheduled, so the block is read-only until you select databases (the console writes the
# selection to dboss.local.yaml). Dumps are zips of a plain-SQL pg_dump and always land under
# pg_backup/<database>/ next to the apps. This feature needs pg_dump and psql on the service
# user's PATH. `postgres: false` hides the tab and stops all inspection and backups.

postgres:
  # libpq connection string or URL. Keep a password out of the committed file with $DATABASE_URL.
  # Empty means: try /var/run/postgresql, then 127.0.0.1:5432, with the PG* environment merged in.
  dsn: ""
  # Databases dumped by the daily run at 04:00 local time, each with its rotation window: week
  # keeps 7 days, month keeps 30 days. A manual backup from the console is never rotated away.
  backups:
    myapp_production: week
    reports: month

# =============================================================================
# PART 2: <app>/dboss.yaml   (required, per app)
# =============================================================================
---
# Only keys listed here are allowed under a host. Anything under defaults.* in the host config
# can be repeated here with the same name to override it for this app. When this file is the
# one `dboss start` runs directly (single mode), part 1 keys are allowed as well.

# Required process map. Keys are process names and values are commands.
# Names must match [a-z][a-z0-9_-]* and commands must not be empty.
# Command strings are not env-expanded; $VAR is passed to the shell at run time.
# A scalar value is a background process. A mapping adds hosts; every process that declares
# hosts is a web process that receives proxied traffic on those hosts, and its command must
# not be empty. An app may have several web processes, each with its own hosts, health,
# canonical host and realtime hub, and each bound to its own PORT. An app with no hosts
# anywhere is background-only. Hosts are matched against the request Host header,
# case-insensitive, port stripped, and must be unique across the app's web processes. A leading
# "*." matches subdomains only; a leading "." matches the bare domain and every subdomain, so
# ".myapp.com" means "myapp.com" and "*.myapp.com". Longest match wins.
# In single mode (no hosts declared) the first process is bound to .lvh.me for local dev.
#
# The static directory is an app key (see the Web keys above); every web process serves it.
#
# A web process may set `health`, the readiness path dboss polls until the start flips to
# running, e.g. /up (GET http://127.0.0.1:PORT/up must answer 2xx). Omitted means a plain TCP
# connect. The same check keeps the process alive after readiness; see unhealthy_threshold.
#
# A web process may set `canonical_host`, one of its hosts. Requests for any other of its
# hosts answer 301 to <scheme>://<canonical_host><path?query>; the scheme follows
# X-Forwarded-Proto, default https. Runs before auth and static files, so www never serves content.
#
# A web process may set `pubsub`, a realtime hub dboss serves on its hosts. It accepts
# true (the /socketio default), a path, or a mapping:
#   pubsub: true                    -> path /socketio
#   pubsub: /realtime               -> that path
#   pubsub:                         -> full settings
#     path: /socketio
#     # Bearer token a publisher presents. Empty generates a 64-character secret per web process
#     # under dir/state on first use; `dboss pubsub` prints it and `dboss pubsub rotate` replaces it.
#     secret: $PUBSUB_SECRET
#     # Messages kept per channel and replayed to a late subscriber, oldest first.
#     replay: 10
#     # Subscriber limit per hub across all channels. 0 means unlimited; further connects get 503.
#     max_clients: 500
#     # Largest accepted publish body. 0 means unlimited.
#     max_message_size: 64k
#     # A subscribed WebSocket client may publish to its own channel. SSE is one-way.
#     client_events: true
#     # Serve the interactive self-test page at <path>/_test.
#     test: false
# The hub is independent of the app process: a subscriber can connect while the app is stopped,
# and realtime traffic never wakes it. Subscribe GET <path>/<channel> (WebSocket or SSE);
# publish POST with the secret. Channels are one path segment; client.js, _test and _selftest are
# reserved. `dboss pubsub help` prints a copy-paste guide.
#
# `count` runs that many copies of one entry (default 1, at most 64), each with its own PORT and
# PROC_INSTANCE (1..count). Copies are named <name>.1 .. <name>.<count> in logs, the console and
# metrics; a single copy keeps the bare name. The proxy sends each request to the ready copy of a
# web process with the fewest requests in flight, and one copy that crashes leaves the app up on
# the others. A web process gets one spare port on top of its copies: `dboss restart` (and every
# deploy restart) starts a new copy there, waits for its health check, moves traffic onto it and
# drains the old one, one copy at a time, so a running app is never down during a restart. A new
# copy that never gets healthy is killed and the old one keeps serving. Background processes are
# stopped and started again, never doubled. A changed count applies on the next restart.
procfile:
  web:
    command: bundle exec puma -C config/puma.rb
    hosts:
      - ".myapp.com"
    pubsub: true
    health: /up
    canonical_host: myapp.com
    count: 2
  worker: bundle exec lux jobs:work
  cron: bundle exec lux jobs:cron

# Start policy. true starts the app with the host and brings it back on resume. false leaves
# it stopped until `dboss run`, the console, or any proxied request starts it; a host restart
# does not bring it back. button is like false, but a request answers a page with a start button
# and only its POST starts the app, so a crawler or favicon GET never does.
autostart: true

# Folder of the pages dboss serves for this app instead of forwarding: starting (waking up),
# waiting (a hand-run start still waits for ENTER), stopped (a button app, with the start
# button), crashed, maintenance, error (the proxy's own 502s and the app's 5xx) and forbidden
# (allow_ips), plus signed_out. For each one dboss reads
# <name>.html here, else template.html here, else the same two in the host's pages folder, else
# the built-in page, on every request. Every page fills {{status}}, {{title}}, {{message}},
# {{action}} (the start button or sign-in link dboss builds), {{app}} and {{dboss_logo}} (the
# dboss mark at /.well-known/dboss/logo.svg); any other {{...}} is left alone, so one
# template.html covers every page. An app 5xx body is only replaced when this folder has
# error.html or template.html. `dboss pages [app]` lists which file serves each page and
# `dboss pages dump [app] [name...]` writes the built-in ones out to edit.
pages: ./public/error_pages

# Permit operators to permanently stop and remove this app through the console or
# `dboss destroy`. False hides the console action and rejects every destroy request.
# In a host's apps directory, a plain app folder is removed recursively; a symlink entry is
# unlinked without following its target. Single-app mode can never destroy itself.
deletable: false

# Per-app overrides of defaults.* (all optional, same semantics as above).
idle_stop: 30m              # this preview app sleeps when unused
health_timeout: 90s
stop_timeout: 30s
stop_signal: TERM
restart: on-failure
max_restarts: 5
log_retention: 168h
stdout_retention: 3h
tmp_clean: false            # this app keeps its own ./tmp
memory_max: 512m
cpu_max: 0
env:
  MALLOC_ARENA_MAX: "2"
static: ./public
static_immutable: [/assets/, /packs/]
max_body: 50m
headers:
  X-Powered-By: ""

# Ports are NOT configurable per app. dboss allocates one per (app, proctype)
# from ports and injects it as PORT into that process's environment,
# always, for every procfile entry. There is no pin, no override, no opt-out.
# An app that ignores PORT and binds its own port will not be reachable
# through the proxy. Read the allocation with `dboss ports`.

# Per-proctype overrides. Process keys only (stop, restart, logs, env,
# resources); a web key here is an error, and `health`/`canonical_host`/`pubsub` live on the web
# procfile entry while the rest are app keys.
# Useful for a worker that needs a longer stop_timeout than the web process it runs next to.
processes:
  worker:
    stop_timeout: 120s
    restart: always

# Scheduled one-shot commands, run by the daemon and independent of the app's run state:
# a stopped or idle app still fires its jobs. Each job runs in the app folder with the app
# environment (APP_NAME, PROC_TYPE, DBOSS_SOCKET; no PORT), logs to its own channel and does
# not count as activity for idle_stop. There is no catch-up: after a daemon restart the next
# run is computed forward from that moment.
cron:
  # Job name, unique in the app; matches [a-z][a-z0-9_-]*.
  cleanup:
    # Either "every <n><s|m|h|d>" or a 5-field cron expression (min hour day month weekday).
    # Cron fields accept *, */n, a-b, a-b/n, a,b,c and JAN..DEC / SUN..SAT; 0 and 7 are Sunday.
    schedule: every 6h
    # Command run once per fire, through /bin/sh -c like a procfile line.
    command: bundle exec rake cleanup
    # Kill a run that is still going after this long. 0 = no limit.
    timeout: 30m
    # false (the default) skips a scheduled run while the previous one is still going.
    overlap: false
    # true keeps the job configured but never scheduled.
    disabled: false
  report:
    schedule: "0 7 * * 1-5"
    command: bundle exec rake report:daily

# A host can declare one built-in hook, `github_pr`, in the root file. Its ping is
# https://<management.host>/hooks/github_pr (one path segment is a host hook, two are an app hook) with
# query params action, branch, repo and num. dboss itself checks out the branch, writes the app
# from `template` (an app file with $VAR and ${VAR} from the params) and starts the app, which
# runs the template's lifecycle steps; action=closed destroys it. The template sets deletable: true. See README "GitHub PR previews".
#
# Deploy hooks: named one-shot commands a signed HTTP POST can trigger, independent of the app's
# run state. The ping URL is https://<management.host>/hooks/<app>/<hook>. Every ping presents
# tokens.dboss from the host file: ?token=<token> in the URL, Authorization: Bearer <token>,
# X-Gitlab-Token: <token>, or a GitHub X-Hub-Signature-256 HMAC over the raw body. Without the
# token every ping answers 401; `dboss hooks` prints the full URL.
hooks:
  # A bare true is shorthand for `git pull --ff-only` in the app folder (git discovers the
  # repository upward) plus restart on exit 0: `deploy: true`. `dboss deploy git <url>` pings
  # the hook named deploy and waits for it, so `deploy: true` is all a git deploy needs. The
  # mapping form follows.
  # Hook name, unique in the app; matches [a-z][a-z0-9_-]*.
  deploy:
    # Command run once per trigger in the app folder with the app environment (no PORT).
    command: ./deploy.sh
    # Kill a run still going after this long. 0 = no limit.
    timeout: 10m
    # true restarts the app (or starts it) when the command exits 0.
    restart: true
    # false (the default) skips a ping while the previous run is still going.
    overlap: false
    # true keeps the hook configured but its endpoint answers 404.
    disabled: false

# Lifecycle steps: commands dboss runs at fixed points of the app's life, so the app can set up
# and clean up what it owns, such as its database. Each step is a command or a
# {command, timeout} mapping; the timeout defaults to 3m. Steps run in the app folder with the
# cron and hook environment (no PORT) and log to the lifecycle-<step> channel.
#   create   once, before the app's first start. The app is recorded in
#            dir/state/created.json only when it exits 0, so a failure retries on the next
#            start; destroy clears the record. An app that already existed runs it once on its
#            next start, so write it to be idempotent.
#   start    before every start and restart, including a wake by the proxy; the processes are
#            spawned only after it exits 0. A process restarted after a crash does not rerun it.
#            A failed create or start leaves the app crashed and sends the crash event.
#   destroy  after `dboss destroy` has stopped the app and detached it, before its folder is
#            removed. It is cleanup: a failure is logged and audited, and the destroy completes.
lifecycle: {}
#   create: bin/setup-db
#   start: {command: bundle exec rake db:migrate, timeout: 10m}
#   destroy: bin/drop-db

# --- Sign-in: AuthCog in front of the app ---------------------------------------------------
# With auth set, a visitor without a session is sent to AuthCog (authcog_realm) and comes back to
# /.well-known/dboss/auth with a signed, host-only cookie. Only the listed emails get in: exact
# addresses, *@domain patterns, or "*" for any AuthCog account; empty leaves the app open. The
# list is checked on every request, so removing an entry ends that session on the next rescan.
# /.well-known/dboss/logout signs out. A sign-in lasts session_ttl.
#
#   - The app receives the signed-in email as X-Dboss-User. dboss removes that header from
#     every inbound request, so the app can trust it.
#   - A request that does not accept text/html gets 401 instead of a redirect.
#   - The health endpoint stays open, static files are protected, and a request without a
#     session never wakes a stopped app.
#   - A pubsub publisher presenting the publish secret passes without a session.
#   - basic_auth is independent: when both are set, both must pass.
# Valid at the app top level and under host `defaults:`, which gates every app on a staging box.
auth: []
#   - ana@example.com
#   - "*@example.com"
session_ttl: 24h

# --- AuthCog login: dboss runs the sign-in for the app --------------------------------------
# authcog: true (path /authcog) or a path turns it on. dboss owns the whole AuthCog round trip on
# the app's behalf, so the app needs no AuthCog code. The app links to the path; dboss mints the
# challenge, sends the browser to authcog_realm, exchanges the callback server-side and then
# forwards one request to the app's own route at that path with the profile in X-Dboss-User. The
# app reads what it needs and creates its own session; dboss keeps no app session. X-Dboss-User
# is removed from every inbound request, so only dboss can set it, and it is set only on that one
# post-login request.
#
#   - Any AuthCog account is admitted; there is no email allowlist here.
#   - The app must answer its own route at the path: read X-Dboss-User, create the session,
#     respond. dboss relays that response, Set-Cookie included, to the browser.
#   - The AuthCog realm's redirect_path must match the path (authcog.com defaults to /authcog).
#   - Independent of `auth`: an app can use both, and the login path is never gated by `auth`.
# Valid at the app top level and under host `defaults:`.
authcog: false

# --- Alerts: request log checks ------------------------------------------------------------
# Once a minute dboss looks at the app's last 5 minutes of requests (once there are at least 20)
# and posts to the notify webhook: `error-rate` when the share of 5xx answers reaches error_rate,
# `slow` when the p95 latency reaches slow_p95. Repeats are bounded by the notifier's 5 minute
# quiet period; there is no recovery event.
# Valid at the app top level and under host `defaults:`. An app with log_retention: 0 has no
# request log and is never checked.
alerts:
  # Percent of 5xx answers that posts error-rate. 0 disables the check.
  error_rate: 10
  # p95 request latency that posts slow. 0 disables the check.
  slow_p95: 0
  #   2s

# --- Events: analytics from log/*.json.log --------------------------------------------------
# Every <ns>.json.log the app writes under ./log (log/billing/invoice.json.log is billing.invoice)
# is an event namespace: one JSON object per line,
#   {"msg": "...", "tags": ["beta", "plan:pro"], "data": {"event": "checkout", "user_id": "u_1", ...}}
# dboss moves event, ts, user_id, anon_id, tenant_id, request_id and value out of data into their
# own columns and stores the rows as Parquet under dir/log/<app>/events, one directory per
# namespace and UTC day, compacted daily. DuckDB, or any Parquet reader, queries them there;
# processes get the path as DBOSS_EVENTS_DIR. A line without an event lands in the app's log
# viewer as a warning. Filters: a bare word is the event, plan:pro a tag pair, #beta a label,
# user= anon= tenant= ns= country= req= the fixed columns, value>10, data.key=v, "text" in msg,
# since=7d from= to=, a leading - negates, a,b is either.
# Valid at the app top level and under host `defaults:`. An app with log_retention: 0 keeps no
# log store and ingests no events either.
events:
  # How long raw events are kept. Daily counts, tag facets and data keys stay after them.
  # 0 stops ingesting events and keeps what is stored.
  retention: 365d
  # Saved filters by name; each becomes a DuckDB view in events/views.sql.
  views: {}
  #   pro_checkouts: "checkout_completed plan:pro"
  # Saved funnels by name. by is user, anon or tenant (default user); window runs from the
  # first step (default 7d); breakdown groups by a field, data.<key> or a tag key.
  funnels: {}
  #   checkout:
  #     by: user
  #     window: 7d
  #     breakdown: plan
  #     steps:
  #       - {name: Pricing, filter: "page_view page:pricing"}
  #       - {name: Started, filter: "checkout_started"}
  #       - {name: Paid, filter: "checkout_completed value>0"}

# Procfile behavior:
#   - Each command runs through /bin/sh -c, so &&, pipes, quotes and $VAR work. Start the
#     line with `exec` to replace the shell with the real process.
#   - Each entry becomes unit dboss-<app>-<name> and gets its own PORT.
#   - PORT is always injected by dboss for every line, including workers and
#     cron-style processes that never listen. Not configurable. A PORT set in
#     .env or .env.local is overwritten and a warning is logged.
#   - Env available to every command, in priority order (highest first):
#       PORT, APP_NAME, PROC_TYPE,                injected by dboss, always win
#       PROC_INSTANCE, DBOSS_SOCKET
#       .env.local                                server-only overrides
#       .env                                      committed defaults
#       defaults.env / dboss.yaml env             dboss config
#       mise env (PATH and tool vars)             when mise.toml exists
#       daemon's own environment                  minimal: HOME, LANG, TZ
#
# --- .env / .env.local format ------------------------------------------------
#
#   KEY=value              no quotes needed
#   KEY="quoted value"     double quotes allow \n and \" escapes
#   KEY='single'           literal
#   # comment
#   export KEY=value       "export " prefix is tolerated and stripped
#   - No variable interpolation. ${OTHER} stays literal.
#   - .env.local should be mode 0600 and is never shipped by dboss deploy sync or lux-deploy.

# =============================================================================
# PART 3: state files under dir/state (written by dboss, read-only for humans)
# =============================================================================
---
# dir/state/running.json
# Apps the daemon intends to be running. Updated on every start/stop and resumed after a daemon
# restart or reboot; without it yet (first start) every app with autostart: true starts.
running.json:
  - myapp
  - myapp-staging

# dir/state/maintenance.json
# Apps currently in maintenance mode. Updated by `dboss maintenance`; survives a restart.
#
# dir/state/<app>/<proctype>.pid
# One line: the pid of the running child. Removed when the process exits.
#
# dir/state/last_activity.json
# Map of app -> RFC3339 timestamp of the last proxied request. Flushed every minute so
# idle accounting survives a daemon restart.
#
# dir/state/management-auth.key
# Random 32-byte key used to sign management console sessions.
# Created with mode 0600 when the console first starts.

# =============================================================================
# CLI lookup rules
# =============================================================================
#
#   Config, every command:   -c path, then $DBOSS_CONFIG, then ./dboss.local.yaml or ./dboss.yaml.
#   Socket, remote commands: --socket, then $DBOSS_SOCKET, then the socket of the config found
#                            above if that file exists on disk, then /run/dboss/dboss.sock.
#   App, remote commands:    the argument, or inside an app folder that folder's app.
#
#   dboss start [-c path]                      foreground host session
#   dboss systemd [-c path] [--user u] [--bin p] [--install]
#   dboss kill [-c path]                       stop every app and clear ports
#   dboss pages [app] | dump [app] [name...]   list the dboss pages or write them out to edit
#   dboss maintenance [app] on|off             answer with the maintenance page, app keeps running
#   dboss password                             print a bcrypt hash for basic_auth
#   DBOSS_SOCKET is injected into app processes, so a process can always find its host.
#
# `dboss config` validates the host file and prints it as written, comments included.
# `dboss config <app>` does the same for that app's file.
# `dboss config -d` / `--defaults` prints the resolved config with every default filled in.
# `dboss config --reference` prints this document.
# Errors name the file, line and key: an unknown key suggests the closest valid one.
# `dboss check` validates the config and every app without starting anything.
#
# The management console edits these same files: the host file and, per app, the file dboss
# reads for that folder (dboss.local.yaml when it exists). "Create server override" copies
# dboss.yaml to dboss.local.yaml so edits made on the box survive the next deploy.
