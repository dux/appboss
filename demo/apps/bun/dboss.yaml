procfile:
  web:
    command: ./start.sh
    hosts:
      - bun.lvh.me
    health: /up
  # A second web process in the same app: its own port, host and health check.
  admin:
    command: ./start.sh
    hosts:
      - admin.bun.lvh.me
    health: /up

# Every web process serves ./public straight from disk at the same URL, so public/dboss.svg
# answers /dboss.svg without waking the app. ./public is the default; false disables it.
static: ./public

# .env sets GREETING too and wins; SOURCE comes only from here. The page at / prints both.
env:
  GREETING: from-config
  SOURCE: config

# Analytics events from log/*.json.log. `make seed` fills the same Parquet store the app would, so
# the console's Events tab has data: a saved view, a second one to filter by page, and a 4-step
# onboarding funnel broken down by plan. Run it with `dboss events funnel bun onboarding` (needs
# the duckdb CLI) or from the Events tab. Try filtering with `plan:pro` or `page:pricing`.
events:
  retention: 30d
  views:
    pro_signups: "signup_completed plan:pro"
    pricing_views: "page_view page:pricing"
  funnels:
    onboarding:
      by: anon
      window: 1d
      breakdown: plan
      steps:
        - {name: Visited pricing, filter: "page_view page:pricing"}
        - {name: Started signup, filter: "signup_started"}
        - {name: Signed up, filter: "signup_completed"}
        - {name: Paid, filter: "checkout_completed"}

cron:
  heartbeat:
    schedule: every 30s
    command: ./cron.sh
  report:
    schedule: "0 7 * * *"
    command: ./cron.sh

hooks:
  deploy:
    command: ./deploy.sh
    timeout: 1m

# create runs once before the first start, start before every start (the web process waits for
# it). Delete .dboss/demo.db and restart to see a failed start leave the app crashed.
lifecycle:
  create: ./lifecycle.sh create
  start: ./lifecycle.sh start
