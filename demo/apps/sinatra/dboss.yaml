procfile:
  web:
    command: ./start.sh
    hosts:
      - .sinatra.lvh.me
    health: /up
    canonical_host: sinatra.lvh.me
  job: ./job.sh

# Serve ./public straight from disk at the same URL (the default folder).
static: ./public

autostart: false

# Sleeps after 2 minutes without requests (the host default is never); the next request wakes it.
idle_stop: 2m

# The dboss pages (starting, maintenance, error, ...) come from public/error_pages/template.html,
# the default pages folder, so they carry the app's look; try /boom.

# Posts error-rate to the notify webhook once more than 10% of the requests in 5 minutes fail.
alerts:
  error_rate: 10

# Analytics from log/shop.json.log (written by /shop): a saved view and a funnel, both also
# shown in the console's Events tab.
events:
  retention: 30d
  views:
    paid: "checkout_completed value>0"
  funnels:
    checkout:
      by: anon
      window: 1d
      breakdown: plan
      steps:
        - {name: Pricing, filter: "page_view page:pricing"}
        - {name: Started, filter: "checkout_started"}
        - {name: Paid, filter: "checkout_completed"}

# Per-process overrides: the job worker stops fast and always comes back; web keeps the app values.
processes:
  job:
    stop_timeout: 1s
    restart: always
