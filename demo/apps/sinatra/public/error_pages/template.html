<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} - Sinatra demo</title>
    <link rel="icon" type="image/svg+xml" href="{{dboss_logo}}">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body class="page">
    <main class="card">
      <p class="eyebrow"><img src="{{dboss_logo}}" alt="" width="18" height="18"> Sinatra demo &middot; {{status}}</p>
      <h1>{{title}}</h1>
      <p>{{message}}</p>
      <div class="action">{{action}}</div>
      <p class="note">Rendered from <code>public/error_pages/template.html</code> in the sinatra app.</p>
    </main>
  </body>
</html>
